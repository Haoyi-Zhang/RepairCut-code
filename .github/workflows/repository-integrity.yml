name: Repository integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  material-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      README_ENTRY: 'README.md'
      MIN_EXPECTED_PYTHON_SOURCES: '11'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate supplied materials and source/configuration syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw-output
          (ulimit -v 3145728; ulimit -t 35; timeout 40s python -B -X utf8 .github/scripts/check_repository.py) 2>&1 | tee raw-output/integrity.log
      - name: Preserve integrity output on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrity-raw-output
          path: raw-output/
          if-no-files-found: warn
          retention-days: 14
