name: Bounded scientific checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MIN_EXPECTED_PYTHON_SOURCES: '11'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate materials and reproduce owned finite evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw-output
          timeout --signal=TERM --kill-after=5s 300s bash -c '
            set -euo pipefail
            ulimit -v 3145728
            ulimit -t 285
            python -B -X utf8 .github/scripts/check_repository.py
            python -B -X utf8 reproduce.py --output raw-output/reproduced
          ' 2>&1 | tee raw-output/run.log
      - name: Preserve raw outputs on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-raw-output
          path: raw-output/
          if-no-files-found: warn
          retention-days: 14
